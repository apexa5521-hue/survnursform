<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">استبيان الجودة — Apex Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#0B3843; --teal-800:#0F4C5C; --teal-700:#166374;
    --sand-500:#D98A47; --sand-100:#FBEBDA;
    --bg:#F4F8F7; --card:#FFFFFF; --ink:#1E2A2E; --muted:#64777A;
    --line:#DCE6E5; --line-soft:#EAF1F0;
    --ok:#2F8F6B; --ok-bg:#E3F4EC; --warn:#B4591B; --warn-bg:#FBEBDA; --info:#245E8A; --info-bg:#E4EFF8; --bad:#9B2C2C; --bad-bg:#FDEDED;
    --font-body:'IBM Plex Sans Arabic','Tahoma',sans-serif;
    --font-head:'IBM Plex Sans Arabic','Tahoma',sans-serif;
  }
  html[lang="en"]{ --font-body:'IBM Plex Sans','Segoe UI',sans-serif; --font-head:'Fraunces',serif; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ overflow-x:hidden; background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.7; -webkit-font-smoothing:antialiased; }
  [hidden]{ display:none !important; }
  .bg-texture{ position:fixed; inset:0; z-index:-1; pointer-events:none;
    background: radial-gradient(60rem 40rem at 90% -10%, rgba(15,76,92,0.07), transparent 60%), radial-gradient(50rem 35rem at -10% 105%, rgba(217,138,71,0.09), transparent 60%); }

  .top-bar{ position:sticky; top:0; z-index:40; background:rgba(244,248,247,0.9); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
  .top-bar-inner{ max-width:640px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:10px 20px; gap:12px; }
  body.portal .top-bar-inner{ max-width:1040px; }
  .top-logo{ height:26px; display:flex; align-items:center; }
  .top-logo img{ height:100%; width:auto; display:block; }
  .lang-switch{ display:flex; background:#fff; border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; }
  .lang-switch button{ font-family:'IBM Plex Sans',sans-serif; border:none; background:transparent; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--muted); padding:6px 14px; border-radius:999px; transition:all .15s ease; }
  .lang-switch button.active{ background:var(--teal-800); color:#fff; }
  .progress-rail{ height:4px; background:var(--line-soft); }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg,var(--teal-700),var(--sand-500)); transition:width .15s ease-out; }

  .wrap{ max-width:640px; margin:0 auto; padding:0 20px; }
  .wrap.wide{ max-width:1040px; }

  header.hero{ padding:40px 20px 24px; text-align:center; max-width:640px; margin:0 auto; }
  html[lang="en"] header.hero{ text-align:left; }
  .logo-wrap{ display:flex; justify-content:center; margin-bottom:20px; }
  html[lang="en"] .logo-wrap{ justify-content:flex-start; }
  .logo-wrap img{ height:44px; width:auto; }
  .eyebrow{ font-size:13px; font-weight:600; color:var(--sand-500); margin-bottom:10px; }
  header.hero h1{ font-family:var(--font-head); font-size:28px; font-weight:600; margin:0; color:var(--teal-900); line-height:1.25; }
  html[lang="en"] header.hero h1{ font-size:34px; letter-spacing:-0.01em; }

  /* ---------- home ---------- */
  .banner{ margin:0 0 16px; padding:12px 16px; border-radius:12px; font-size:13.5px; }
  .banner.bad{ background:var(--bad-bg); color:var(--bad); border:1px solid #F3C6C6; }
  .banner.info{ background:var(--info-bg); color:var(--info); border:1px solid #C5DCEE; }
  .big-card{ width:100%; display:flex; align-items:center; gap:16px; text-align:start; background:var(--teal-800); color:#fff; border:none; border-radius:18px; padding:20px 22px; cursor:pointer; font-family:inherit; transition:transform .1s ease, background .15s ease; }
  .big-card:hover:not(:disabled){ background:var(--teal-700); }
  .big-card:active:not(:disabled){ transform:scale(.99); }
  .big-card.locked{ background:#fff; color:var(--muted); border:1.5px dashed var(--line); cursor:not-allowed; }
  .bc-icon{ width:46px; height:46px; border-radius:14px; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; flex:none; }
  .big-card.locked .bc-icon{ background:var(--line-soft); }
  .bc-icon svg{ width:24px; height:24px; }
  .bc-body{ flex:1; min-width:0; }
  .bc-title{ font-family:var(--font-head); font-size:18px; font-weight:600; }
  .bc-desc{ font-size:13px; opacity:.85; margin-top:2px; }
  .badge{ font-size:12px; font-weight:600; padding:4px 12px; border-radius:999px; white-space:nowrap; flex:none; }
  .badge.ok{ background:var(--sand-500); color:#fff; }
  .badge.lock{ background:var(--line-soft); color:var(--muted); }
  h3.sub{ font-family:var(--font-head); font-size:18px; color:var(--teal-900); margin:30px 0 4px; }
  p.hint{ color:var(--muted); font-size:14px; margin:0 0 14px; }
  .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tile{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; text-align:start; cursor:pointer; font-family:inherit; color:var(--ink); transition:border-color .15s ease, transform .1s ease, box-shadow .15s ease; }
  .tile:hover{ border-color:var(--teal-700); box-shadow:0 4px 14px rgba(15,76,92,.08); }
  .tile:active{ transform:scale(.99); }
  .tile-ic{ width:38px; height:38px; border-radius:11px; background:var(--sand-100); color:var(--sand-500); display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
  .tile-ic svg{ width:20px; height:20px; }
  .tile-t{ font-weight:600; font-size:15px; color:var(--teal-900); }
  .tile-h{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .tile:last-child:nth-child(odd){ grid-column:1 / -1; }
  .foot{ text-align:center; padding:34px 0 50px; }
  .foot a{ color:var(--muted); font-size:13px; text-decoration:none; border-bottom:1px dashed var(--line); padding-bottom:1px; cursor:pointer; }
  .foot a:hover{ color:var(--teal-800); border-color:var(--teal-800); }

  /* ---------- form ---------- */
  button.back{ background:none; border:none; cursor:pointer; font-family:inherit; color:var(--teal-700); font-size:14px; font-weight:600; padding:18px 0 6px; }
  .form-title{ font-family:var(--font-head); font-size:24px; color:var(--teal-900); margin:4px 0 4px; }
  .section{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px 22px; margin-bottom:18px; }
  .section-head{ display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .section-head .num{ width:30px; height:30px; border-radius:9px; background:var(--sand-100); color:var(--sand-500); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none; font-family:'IBM Plex Sans',sans-serif; }
  .section-head h2{ font-family:var(--font-head); font-size:17px; font-weight:600; margin:0; color:var(--teal-900); }
  html[lang="en"] .section-head h2{ font-size:19px; }
  .field{ margin-bottom:18px; }
  .field:last-child{ margin-bottom:0; }
  label.q{ display:block; font-size:14.5px; font-weight:600; margin-bottom:9px; }
  label.q .opt{ font-weight:400; color:var(--muted); font-size:13px; }
  input[type=text], input[type=password], input[type=date], input[type=email], input[type=number], textarea, select{
    width:100%; font-family:inherit; font-size:14.5px; color:var(--ink); background:#FBFDFD; border:1.5px solid var(--line); border-radius:10px; padding:11px 13px; resize:vertical; transition:border-color .15s ease, background .15s ease; }
  textarea{ min-height:84px; }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--teal-700); background:#fff; }
  .field.invalid textarea, .field.invalid select, .field.invalid input[type=text]{ border-color:#D26A6A; background:#FFF8F8; }
  .field.invalid .choice span{ border-color:#E4A5A5; }
  .err{ color:var(--bad); font-size:12.5px; margin-top:6px; }
  .choice-group{ display:flex; gap:10px; flex-wrap:wrap; }
  .choice{ position:relative; }
  .choice input{ position:absolute; opacity:0; inset:0; cursor:pointer; margin:0; }
  .choice span{ display:inline-flex; align-items:center; gap:8px; padding:9px 18px; border:1.5px solid var(--line); border-radius:999px; font-size:14px; font-weight:500; background:#FBFDFD; transition:all .15s ease; }
  .choice input:checked + span{ border-color:var(--teal-700); background:var(--teal-800); color:#fff; }
  .choice input:focus-visible + span{ outline:2px solid var(--sand-500); outline-offset:2px; }
  .scale{ display:flex; justify-content:space-between; gap:6px; }
  .scale .choice span{ width:44px; height:44px; padding:0; border-radius:12px; justify-content:center; font-weight:600; }
  .scale-caps{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:8px; }
  .conditional{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); display:none; }
  .conditional.show{ display:block; }
  .hp{ position:absolute; top:0; inset-inline-start:0; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none; }
  button.primary{ width:100%; background:var(--teal-800); color:#fff; border:none; border-radius:14px; padding:16px; font-size:16px; font-weight:600; font-family:inherit; cursor:pointer; transition:background .15s ease, transform .1s ease; }
  button.primary:hover{ background:var(--teal-700); }
  button.primary:active{ transform:scale(.99); }
  button.primary:disabled{ background:#A9BCBE; cursor:not-allowed; }
  .form-banner{ margin-bottom:14px; }

  .state-screen{ max-width:520px; margin:90px auto; padding:0 24px; text-align:center; }
  .state-screen .icon{ width:64px; height:64px; border-radius:50%; background:var(--sand-100); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; }
  .state-screen h2{ font-family:var(--font-head); color:var(--teal-900); font-size:23px; margin:0 0 10px; }
  .state-screen p{ color:var(--muted); font-size:14.5px; margin:0 0 6px; }
  .refbox{ display:inline-block; margin:14px 0 24px; padding:10px 22px; border-radius:12px; background:#fff; border:1px solid var(--line); font-weight:700; letter-spacing:.04em; color:var(--teal-800); font-size:20px; font-family:'IBM Plex Sans',sans-serif; direction:ltr; }
  button.secondary{ background:#fff; color:var(--teal-800); border:1.5px solid var(--teal-800); border-radius:12px; padding:11px 22px; font-size:14.5px; font-weight:600; font-family:inherit; cursor:pointer; }
  button.secondary:hover{ background:var(--line-soft); }
  button.danger{ background:#fff; color:var(--bad); border:1.5px solid #E4A5A5; border-radius:12px; padding:9px 18px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; }
  button.small{ padding:7px 14px; font-size:13px; border-radius:10px; }
  button.btn{ background:var(--teal-800); color:#fff; border:none; border-radius:12px; padding:11px 22px; font-size:14.5px; font-weight:600; font-family:inherit; cursor:pointer; }
  button.btn:hover{ background:var(--teal-700); }
  button.btn:disabled{ background:#A9BCBE; cursor:not-allowed; }

  /* ---------- login ---------- */
  .login-card{ max-width:400px; margin:60px auto; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:30px 26px; }
  .login-card h2{ font-family:var(--font-head); color:var(--teal-900); margin:0 0 4px; font-size:22px; }
  .login-card p{ color:var(--muted); font-size:14px; margin:0 0 20px; }

  /* ---------- portal ---------- */
  .p-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:24px 0 8px; }
  .p-head h1{ font-family:var(--font-head); font-size:24px; color:var(--teal-900); margin:0; }
  .p-user{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:14px; color:var(--muted); }
  .role-pill{ background:var(--sand-100); color:var(--warn); font-weight:600; font-size:12.5px; padding:3px 12px; border-radius:999px; }
  .tabs{ display:flex; gap:6px; border-bottom:1px solid var(--line); margin:12px 0 20px; overflow-x:auto; }
  .tab{ background:none; border:none; border-bottom:3px solid transparent; padding:10px 16px; font-family:inherit; font-size:14.5px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .tab.active{ color:var(--teal-800); border-color:var(--teal-800); }
  .stats{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:18px; }
  .stat{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; cursor:pointer; text-align:start; font-family:inherit; color:var(--ink); }
  .stat.on{ border-color:var(--teal-800); box-shadow:0 0 0 1px var(--teal-800) inset; }
  .stat .n{ font-size:24px; font-weight:700; font-family:'IBM Plex Sans',sans-serif; color:var(--teal-900); line-height:1.1; }
  .stat .l{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .stat.late .n{ color:var(--bad); }
  .filters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .filters select, .filters input{ width:auto; min-width:150px; padding:9px 12px; font-size:14px; }
  .filters input{ flex:1; min-width:180px; }
  .cases{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .case{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer; text-align:start; font-family:inherit; color:var(--ink); transition:border-color .15s ease, box-shadow .15s ease; }
  .case:hover{ border-color:var(--teal-700); box-shadow:0 4px 14px rgba(15,76,92,.08); }
  .case.late{ border-inline-start:4px solid #D26A6A; }
  .case-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .ref{ font-weight:700; color:var(--teal-800); font-family:'IBM Plex Sans',sans-serif; direction:ltr; }
  .case-meta{ font-size:12.5px; color:var(--muted); margin-bottom:8px; }
  .case-prev{ font-size:13.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .pill{ font-size:12px; font-weight:600; padding:2px 11px; border-radius:999px; white-space:nowrap; }
  .st-new{ background:var(--warn-bg); color:var(--warn); }
  .st-prog{ background:var(--info-bg); color:var(--info); }
  .st-done{ background:var(--ok-bg); color:var(--ok); }
  .late-tag{ background:var(--bad-bg); color:var(--bad); }
  .empty{ text-align:center; color:var(--muted); padding:50px 0; background:var(--card); border:1px dashed var(--line); border-radius:14px; }

  .modal-back{ position:fixed; inset:0; background:rgba(11,56,67,.45); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:30px 14px; overflow-y:auto; }
  .modal{ background:var(--card); border-radius:18px; width:100%; max-width:720px; padding:24px 24px 26px; position:relative; }
  .modal.narrow{ max-width:440px; margin-top:8vh; }
  .modal h2{ font-family:var(--font-head); font-size:20px; margin:0; color:var(--teal-900); }
  .modal-x{ position:absolute; top:14px; inset-inline-end:16px; background:none; border:none; font-size:26px; line-height:1; color:var(--muted); cursor:pointer; }
  .meta-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:16px 0; }
  .meta-grid div{ background:var(--bg); border-radius:10px; padding:8px 12px; font-size:13.5px; }
  .meta-grid span{ display:block; color:var(--muted); font-size:12px; }
  .qa{ border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:18px; }
  .qa-row{ display:grid; grid-template-columns:38% 1fr; }
  .qa-row + .qa-row{ border-top:1px solid var(--line); }
  .qa-q{ background:var(--bg); padding:10px 14px; font-weight:600; font-size:13.5px; }
  .qa-a{ padding:10px 14px; font-size:14px; white-space:pre-wrap; word-break:break-word; }
  h4.mh{ font-family:var(--font-head); font-size:15px; margin:18px 0 8px; color:var(--teal-900); }
  .timeline{ border-inline-start:2px solid var(--line); margin:0 8px 10px; padding-inline-start:16px; }
  .tl{ position:relative; margin-bottom:12px; font-size:13.5px; }
  .tl::before{ content:''; position:absolute; inset-inline-start:-23px; top:7px; width:10px; height:10px; border-radius:50%; background:var(--teal-700); }
  .tl small{ color:var(--muted); display:block; }
  .action-box{ background:var(--bg); border-radius:14px; padding:16px; margin-top:6px; }
  .row{ display:flex; gap:12px; flex-wrap:wrap; }
  .row > .field{ flex:1; min-width:180px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:16px; }
  .card h3{ font-family:var(--font-head); font-size:17px; margin:0 0 4px; color:var(--teal-900); }
  .card .hint{ margin-bottom:14px; }
  .switch-row{ display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .status-dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-inline-end:6px; }
  table.tbl{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.tbl th, table.tbl td{ text-align:start; padding:9px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  table.tbl th{ color:var(--muted); font-weight:600; font-size:12.5px; }
  .tbl-wrap{ overflow-x:auto; }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--teal-900); color:#fff; padding:11px 22px; border-radius:12px; font-size:14px; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.18); }
  .toast.bad{ background:var(--bad); }
  @media (max-width:640px){
    .stats{ grid-template-columns:repeat(2,1fr); }
    .tiles{ grid-template-columns:1fr; }
    .qa-row{ grid-template-columns:1fr; }
    .tile:last-child:nth-child(odd){ grid-column:auto; }
  }
</style>
</head>
<body>
<div class="bg-texture"></div>

const VIEWS = ['viewHome', 'viewForm', 'viewDone', 'viewLogin', 'viewPortal'];
function show(id) {
  VIEWS.forEach(v => { $('#' + v).hidden = v !== id; });
  state.view = id;
  document.body.classList.toggle('portal', id === 'viewPortal');
  $('#langSwitch').hidden = (id === 'viewLogin' || id === 'viewPortal');
  window.scrollTo(0, 0);
}

function setLang(lang) {
  const snap = state.view === 'viewForm' ? snapshot() : null;
  state.lang = lang;
  const html = $('#htmlRoot');
  html.setAttribute('lang', lang);
  html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.title = t('pageTitle');
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  $$('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  $('#btnAr').classList.toggle('active', lang === 'ar');
  $('#btnEn').classList.toggle('active', lang === 'en');
  $('#btnBack').textContent = t('back');
  $('#submitBtn').textContent = t('submit');
  renderHome();
  if (state.view === 'viewForm') { buildForm(); restore(snap); }
}

function renderHome() {
  const c = state.config;
  const open = c.loaded && c.fullOpen;
  const fc = $('#fullCard');
  fc.className = 'big-card' + (open ? '' : ' locked');
  fc.disabled = !open;
  const range = open && c.to ? ' · ' + t('until') + ' ' + c.to : '';
  fc.innerHTML = '<div class="bc-icon">' + (open ? ICONS.open : ICONS.lock) + '</div>' +
    '<div class="bc-body"><div class="bc-title">' + esc(t('fullTitle')) + '</div><div class="bc-desc">' + esc(open ? t('fullDesc') + range : t('fullClosedDesc')) + '</div></div>' +
    '<span class="badge ' + (open ? 'ok' : 'lock') + '">' + esc(open ? t('fullOpen') : t('fullClosed')) + '</span>';
  $('#tiles').innerHTML = SECTIONS.map(s =>
    '<button type="button" class="tile" data-dept="' + s.id + '"><div class="tile-ic">' + ICONS[s.id] + '</div><div class="tile-t">' + esc(s[state.lang]) + '</div><div class="tile-h">' + esc(state.lang === 'ar' ? s.hAr : s.hEn) + '</div></button>').join('');
  const note = $('#cfgNote');
  if (isPlaceholder()) { note.textContent = t('notConnected'); note.hidden = false; }
  else if (c.failed) { note.textContent = t('cfgFail'); note.hidden = false; }
  else note.hidden = true;
}

async function loadConfig() {
  if (isPlaceholder()) { renderHome(); return; }
  try {
    const res = await fetch(SCRIPT_URL + '?action=config');
    const j = await res.json();
    if (!j.ok) throw new Error('cfg');
    state.config = { loaded: true, fullOpen: !!j.fullOpen, from: j.from || '', to: j.to || '', failed: false };
  } catch (e) { state.config = { loaded: false, fullOpen: false, from: '', to: '', failed: true }; }
  renderHome();
}

const form = $('#surveyForm');

function questionsInScope() { return QUESTIONS.filter(q => state.mode === 'full' || q.sec === state.dept); }

function qHtml(q) {
  const L = state.lang;
  let ctl = '';
  if (q.type === 'text') ctl = '<textarea name="' + q.id + '" rows="3"></textarea>';
  if (q.type === 'yesno') {
    ctl = '<div class="choice-group">' + ['yes', 'no'].map(v => '<label class="choice"><input type="radio" name="' + q.id + '" value="' + v + '"><span>' + esc(t(v)) + '</span></label>').join('') + '</div>';
    if (q.follow) ctl += '<div class="conditional" data-follow="' + q.follow.id + '" data-when="' + q.follow.showWhen + '" data-parent="' + q.id + '"><label class="q">' + esc(q.follow[L]) + '</label><textarea name="' + q.follow.id + '" rows="3"></textarea><div class="err" hidden>' + esc(t('required')) + '</div></div>';
  }
  if (q.type === 'scale') {
    ctl = '<div class="scale">' + [1, 2, 3, 4, 5].map(n => '<label class="choice"><input type="radio" name="' + q.id + '" value="' + n + '"><span>' + n + '</span></label>').join('') + '</div>' +
      '<div class="scale-caps"><span>' + esc(q.caps[L][0]) + '</span><span>' + esc(q.caps[L][1]) + '</span></div>';
  }
  return '<div class="field" data-field="' + q.id + '"><label class="q">' + esc(q[L]) + '</label>' + ctl + '<div class="err" hidden data-main-err>' + esc(t('required')) + '</div></div>';
}

function buildForm() {
  const L = state.lang;
  const secs = state.mode === 'full' ? SECTIONS : SECTIONS.filter(s => s.id === state.dept);
  $('#qContainer').innerHTML = secs.map((s, i) =>
    '<div class="section"><div class="section-head">' + (state.mode === 'full' ? '<div class="num">' + (i + 1) + '</div>' : '') + '<h2>' + esc(s[L]) + '</h2></div>' +
    QUESTIONS.filter(q => q.sec === s.id).map(qHtml).join('') + '</div>').join('');
  $('#formTitle').textContent = state.mode === 'full' ? t('fullTitle') : (SECTIONS.find(s => s.id === state.dept) || {})[L];
  $('#formSub').textContent = state.mode === 'full' ? t('formSubFull') : t('formSubDept');
}

function snapshot() {
  const o = {};
  new FormData(form).forEach((v, k) => { o[k] = v; });
  return o;
}
function restore(o) {
  if (!o) return;
  Object.keys(o).forEach(k => {
    $$('[name="' + k + '"]', form).forEach(el => {
      if (el.type === 'radio') el.checked = el.value === o[k]; else el.value = o[k];
    });
  });
  syncFollow();
}
function syncFollow() {
  $$('.conditional[data-follow]', form).forEach(c => {
    const sel = $('input[name="' + c.getAttribute('data-parent') + '"]:checked', form);
    c.classList.toggle('show', !!sel && sel.value === c.getAttribute('data-when'));
  });
}

function openForm(mode, dept) {
  state.mode = mode; state.dept = dept || null;
  form.reset();
  $('#formBanner').hidden = true;
  clearErrors();
  buildForm();
  show('viewForm');
}

function clearErrors() {
  $$('.field.invalid', form).forEach(f => f.classList.remove('invalid'));
  $$('.err', form).forEach(e => { e.hidden = true; });
}

function validate() {
  clearErrors();
  const bad = [];
  const mark = (fieldEl, errEl) => { if (fieldEl) fieldEl.classList.add('invalid'); if (errEl) errEl.hidden = false; bad.push(fieldEl || errEl); };
  if (!$('#branch').value) mark($('[data-field="branch"]', form), $('[data-field="branch"] .err', form));
  questionsInScope().forEach(q => {
    const f = $('[data-field="' + q.id + '"]', form);
    if (!f) return;
    let ok;
    if (q.type === 'text') ok = $('textarea', f).value.trim().length > 0;
    else ok = !!$('input:checked', f);
    if (!ok) { mark(f, $('[data-main-err]', f)); return; }
    if (q.follow) {
      const sel = $('input:checked', f);
      if (sel && sel.value === q.follow.showWhen) {
        const c = $('.conditional[data-follow]', f);
        if (!$('textarea', c).value.trim()) { f.classList.add('invalid'); $('.err', c).hidden = false; bad.push(c); }
      }
    }
  });
  if (bad.length) bad[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
  return bad.length === 0;
}

form.addEventListener('change', e => {
  if (e.target.type === 'radio') syncFollow();
  const f = e.target.closest('.field');
  if (f && f.classList.contains('invalid')) { f.classList.remove('invalid'); $$('.err', f).forEach(x => { x.hidden = true; }); }
});
form.addEventListener('input', e => {
  const f = e.target.closest('.field');
  if (f && f.classList.contains('invalid') && e.target.value.trim()) { f.classList.remove('invalid'); $$('.err', f).forEach(x => { x.hidden = true; }); }
});

function formError(msg) { const b = $('#formBanner'); b.textContent = msg; b.hidden = false; b.scrollIntoView({ behavior: 'smooth', block: 'center' }); }

form.addEventListener('submit', async e => {
  e.preventDefault();
  if (state.busy) return;
  $('#formBanner').hidden = true;
  if (isPlaceholder()) { formError(t('notConnected')); return; }
  if (!validate()) return;
  const snap = snapshot();
  const answers = {};
  questionsInScope().forEach(q => {
    answers[q.id] = (snap[q.id] || '').trim();
    if (q.follow && snap[q.id] === q.follow.showWhen) answers[q.follow.id] = (snap[q.follow.id] || '').trim();
  });
  const payload = { action: 'submit', type: state.mode, dept: state.dept, branch: snap.branch, name: (snap.name || '').trim(), lang: state.lang, answers: answers, hp: snap.hp || '' };
  state.busy = true;
  const btn = $('#submitBtn');
  btn.disabled = true; btn.textContent = t('submitting');
  try {
    const res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    const j = await res.json();
    if (j.ok) {
      $('#refBox').textContent = j.ref;
      show('viewDone');
    } else if (j.error === 'locked') { formError(t('errLocked')); loadConfig(); }
    else if (j.error === 'invalid_answers') formError(t('errInvalid'));
    else if (j.error === 'invalid_branch') formError(t('errBranch'));
    else formError(t('errServer'));
  } catch (err) { formError(t('errNet')); }
  state.busy = false; btn.disabled = false; btn.textContent = t('submit');
});

function loadSession() { try { const s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); if (s && s.token) { portal.token = s.token; portal.user = s.user; return true; } } catch (e) {} return false; }

async function api(action, data) {
  let j;
  try {
    const res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: action, token: portal.token }, data || {})) });
    j = await res.json();
  } catch (e) { return { ok: false, error: 'net' }; }
  if (!j.ok && j.error === 'auth') { clearSession(); showLogin('انتهت الجلسة. ادخل مرة أخرى.'); }
  if (!j.ok && j.error === 'must_change') openPasswordModal(true);
  return j;
}

function renderTabs() {

}

async function renderTab() {
  renderTabs();

/* ---------- البلاغات ---------- */
const tsOf = s => new Date(String(s).replace(' ', 'T') + '+03:00').getTime();
const fmt = s => String(s || '').slice(0, 16);
const isLate = c => c.status !== 'تم الحل' && (Date.now() - tsOf(c.created)) / 86400000 >= portal.overdueDays;
const stClass = s => s === 'جديد' ? 'st-new' : s === 'قيد المعالجة' ? 'st-prog' : 'st-done';

function filtered() {
  const f = portal.filters;
  const q = f.q.trim().toLowerCase();
  return portal.cases.filter(c => {
    if (f.status === 'late' ? !isLate(c) : (f.status !== 'all' && c.status !== f.status)) return false;
    if (f.dept && c.dept_id !== f.dept) return false;
    if (f.branch && c.branch !== f.branch) return false;
    if (q && !(c.ref + ' ' + c.name + ' ' + c.items.map(i => i.a).join(' ')).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => tsOf(b.created) - tsOf(a.created));
}

function renderCases() {
  const all = portal.cases;
  const cnt = s => all.filter(c => c.status === s).length;
  const late = all.filter(isLate).length;
  const f = portal.filters;
  const stat = (key, n, label, cls) => '<button type="button" class="stat ' + (cls || '') + (f.status === key ? ' on' : '') + '" data-status="' + key + '"><div class="n">' + n + '</div><div class="l">' + label + '</div></button>';
  const isAdmin = portal.user.role === 'admin';
  $('#tabBody').innerHTML =
    '<div class="stats">' + stat('all', all.length, 'كل البلاغات') + stat('جديد', cnt('جديد'), 'جديدة') + stat('قيد المعالجة', cnt('قيد المعالجة'), 'قيد المعالجة') + stat('تم الحل', cnt('تم الحل'), 'تم حلها') + stat('late', late, 'متأخرة (' + portal.overdueDays + '+ أيام)', 'late') + '</div>' +
    '<div class="filters">' +
    (isAdmin ? '<select id="fDept"><option value="">كل الأقسام</option>' + portal.depts.map(d => '<option value="' + d.id + '"' + (f.dept === d.id ? ' selected' : '') + '>' + esc(d.name) + '</option>').join('') + '</select>' : '') +
    '<select id="fBranch"><option value="">كل الفروع</option><option value="بريدة"' + (f.branch === 'بريدة' ? ' selected' : '') + '>بريدة</option><option value="عنيزة"' + (f.branch === 'عنيزة' ? ' selected' : '') + '>عنيزة</option><option value="غير محدد"' + (f.branch === 'غير محدد' ? ' selected' : '') + '>غير محدد (قديم)</option></select>' +
    '<input type="text" id="fQ" placeholder="بحث بالرقم المرجعي أو النص..." value="' + esc(f.q) + '">' +
    '<button type="button" class="secondary small" id="btnRefresh">تحديث</button></div>' +
    '<div class="cases" id="caseList"></div>';
  renderCaseList();
}

function renderCaseList() {
  const list = filtered();
  $('#caseList').innerHTML = list.length ? list.map(c => {
    const late = isLate(c);
    return '<button type="button" class="case' + (late ? ' late' : '') + '" data-case="' + esc(c.case_id) + '"><div class="case-top"><span class="ref">' + esc(c.ref) + '</span><span>' +
      (late ? '<span class="pill late-tag">متأخر</span> ' : '') + '<span class="pill ' + stClass(c.status) + '">' + esc(c.status) + '</span></span></div>' +
      '<div class="case-meta">' + (portal.user.role === 'admin' ? esc(c.dept) + ' · ' : '') + esc(c.branch) + ' · ' + esc(fmt(c.created)) + (c.type === 'كامل' ? ' · استبيان كامل' : '') + '</div>' +
      '<div class="case-prev">' + esc((c.items.find(i => !/^\d$/.test(String(i.a).trim())) || c.items[0] || {}).a || '') + '</div></button>';
  }).join('') : '<div class="empty" style="grid-column:1/-1">لا توجد بلاغات مطابقة.</div>';
}

async function refreshCases() {
  const j = await api('listCases');
  if (j.ok) { portal.cases = j.cases; portal.depts = j.depts; portal.overdueDays = j.overdueDays; if (portal.tab === 'cases') renderCases(); }
  else toast(errMsg(j), true);
}

/* ---------- نافذة البلاغ ---------- */
function closeModal() { $('#modalHost').innerHTML = ''; }

async function openCase(id) {
  $('#modalHost').innerHTML = '<div class="modal-back"><div class="modal"><div class="empty">جاري التحميل...</div></div></div>';
  const j = await api('caseDetail', { case_id: id });
  if (!j.ok) { closeModal(); if (j.error !== 'auth') toast(errMsg(j), true); return; }
  drawCase(j.case, j.history);
}

function drawCase(c, history) {
  const late = isLate(c);
  const days = Math.max(0, Math.floor((Date.now() - tsOf(c.created)) / 86400000));
  $('#modalHost').innerHTML =
    '<div class="modal-back" data-close-bg><div class="modal"><button type="button" class="modal-x" data-close aria-label="إغلاق">×</button>' +
    '<h2><span class="ref">' + esc(c.ref) + '</span> · ' + esc(c.dept) + ' <span class="pill ' + stClass(c.status) + '" style="font-size:13px">' + esc(c.status) + '</span>' + (late ? ' <span class="pill late-tag">متأخر</span>' : '') + '</h2>' +
    '<div class="meta-grid"><div><span>التاريخ والوقت</span>' + esc(fmt(c.created)) + '</div><div><span>الفرع</span>' + esc(c.branch) + '</div><div><span>المُرسِل</span>' + esc(c.name || 'مجهول') + '</div><div><span>النوع</span>' + (c.type === 'كامل' ? 'استبيان كامل' : 'استبيان قسم') + '</div><div><span>عمر البلاغ</span>' + days + ' يوم</div>' +
    (c.first_response ? '<div><span>أول رد</span>' + esc(fmt(c.first_response)) + '</div>' : '') + (c.closed ? '<div><span>تاريخ الإغلاق</span>' + esc(fmt(c.closed)) + '</div>' : '') + '</div>' +
    '<h4 class="mh">الأسئلة والإجابات</h4><div class="qa">' + c.items.map(i => '<div class="qa-row"><div class="qa-q">' + esc(i.q) + '</div><div class="qa-a">' + esc(i.a) + '</div></div>').join('') + '</div>' +
    '<h4 class="mh">سجل المعالجة</h4><div class="timeline">' + history.map(h => '<div class="tl"><b>' + esc(h.action) + '</b> — ' + esc(h.user) + ' <span class="pill ' + stClass(h.status) + '" style="font-size:11px">' + esc(h.status) + '</span><small>' + esc(fmt(h.time)) + '</small>' + (h.note ? '<div>' + esc(h.note) + '</div>' : '') + '</div>').join('') + '</div>' +
    '<div class="action-box"><div class="row"><div class="field"><label class="q">الحالة</label><select id="cStatus">' + ['جديد', 'قيد المعالجة', 'تم الحل'].map(s => '<option' + (s === c.status ? ' selected' : '') + '>' + s + '</option>').join('') + '</select></div></div>' +
    '<div class="field"><label class="q">الرد / الملاحظة <span class="opt">(إلزامي عند اختيار «تم الحل»)</span></label><textarea id="cNote" rows="3" placeholder="اكتب ما تم أو ما سيتم..."></textarea></div>' +
    '<div id="cErr" class="banner bad" hidden></div><button type="button" class="btn" id="cSave" data-case-id="' + esc(c.case_id) + '">حفظ</button></div></div></div>';
}

async function saveCase(id) {
  const status = $('#cStatus').value, note = $('#cNote').value.trim();
  const err = $('#cErr'); err.hidden = true;
  if (status === 'تم الحل' && !note) { err.textContent = ERR_AR.note_required; err.hidden = false; return; }
  const btn = $('#cSave'); btn.disabled = true;
  const j = await api('updateCase', { case_id: id, status: status, note: note });
  if (!j.ok) { btn.disabled = false; err.textContent = errMsg(j); err.hidden = false; return; }
  const i = portal.cases.findIndex(x => x.case_id === id);
  if (i >= 0) portal.cases[i] = j.case;
  drawCase(j.case, j.history);
  if (portal.tab === 'cases') renderCases();
  toast('تم حفظ التحديث');
}

/* ---------- الإعدادات (مدير) ---------- */
async function renderSettings() {
  $('#tabBody').innerHTML = '<div class="empty">جاري التحميل...</div>';
  const j = await api('getSettings');
  if (!j.ok) { $('#tabBody').innerHTML = '<div class="empty">' + esc(errMsg(j)) + '</div>'; return; }
  portal.settings = j;
  $('#tabBody').innerHTML =
    '<div class="card"><h3>قفل الاستبيان الكامل</h3><p class="hint">الاستبيان الكامل مقفل افتراضياً. عند فتحه تصبح جميع أسئلته إلزامية. استبيانات الأقسام مفتوحة دائماً.</p>' +
    '<div class="switch-row"><label class="choice"><input type="checkbox" id="sOpen" style="position:absolute;opacity:0"' + (j.fullOpen ? ' checked' : '') + '><span id="sOpenLbl"></span></label><span id="sNow"></span></div>' +
    '<div class="row"><div class="field"><label class="q">من تاريخ <span class="opt">(اختياري)</span></label><input type="date" id="sFrom" value="' + esc(j.from) + '"></div><div class="field"><label class="q">إلى تاريخ <span class="opt">(اختياري)</span></label><input type="date" id="sTo" value="' + esc(j.to) + '"></div></div></div>' +
    '<div class="card"><h3>إيميلات الأقسام</h3><p class="hint">يصل لكل قسم إيميل بالبلاغات الخاصة به فقط. أكثر من إيميل: افصل بينها بفاصلة. إن تُرك فارغاً لا يُرسل إيميل ويبقى البلاغ ظاهراً في البوابة.</p>' +
    j.depts.map(d => '<div class="field"><label class="q">' + esc(d.name) + '</label><input type="text" data-dept-email="' + d.id + '" value="' + esc(d.emails) + '" style="direction:ltr;text-align:start" placeholder="name@example.com"></div>').join('') + '</div>' +
    '<div class="card"><h3>عام</h3><div class="field"><label class="q">إيميل الجودة لنسخة من كل بلاغ <span class="opt">(اختياري)</span></label><input type="text" id="sCc" value="' + esc(j.qualityCc) + '" style="direction:ltr;text-align:start"></div>' +
    '<div class="field"><label class="q">رابط هذه الصفحة <span class="opt">(يظهر زر «فتح البلاغ» في الإيميلات)</span></label><input type="text" id="sUrl" value="' + esc(j.pageUrl) + '" style="direction:ltr;text-align:start" placeholder="https://..."></div>' +
    '<div class="field"><label class="q">أيام التأخير <span class="opt">(بلاغ غير محلول بعد هذه المدة يُعد متأخراً)</span></label><input type="number" id="sOd" min="1" max="60" value="' + j.overdueDays + '" style="max-width:120px"></div></div>' +
    '<div id="sErr" class="banner bad" hidden></div><button type="button" class="btn" id="sSave">حفظ الإعدادات</button>';
  syncOpenLabel();
  $('#sNow').innerHTML = j.fullOpenNow ? '<span class="status-dot" style="background:var(--ok)"></span>مفتوح للتمريض الآن' : '<span class="status-dot" style="background:#B8C4C6"></span>مغلق للتمريض الآن';
}
function syncOpenLabel() { const on = $('#sOpen').checked; $('#sOpenLbl').textContent = on ? 'الاستبيان الكامل: مفتوح (إلزامي)' : 'الاستبيان الكامل: مقفل'; $('#sOpenLbl').parentElement.classList.toggle('on', on); }

async function saveSettings() {
  const err = $('#sErr'); err.hidden = true;
  const btn = $('#sSave'); btn.disabled = true;
  const j = await api('saveSettings', {
    fullOpen: $('#sOpen').checked, from: $('#sFrom').value, to: $('#sTo').value, qualityCc: $('#sCc').value, pageUrl: $('#sUrl').value, overdueDays: $('#sOd').value,
    depts: $$('[data-dept-email]').map(i => ({ id: i.getAttribute('data-dept-email'), emails: i.value }))
  });
  btn.disabled = false;
  if (!j.ok) { err.textContent = errMsg(j) + (j.field ? ' (' + j.field + ')' : ''); err.hidden = false; err.scrollIntoView({ block: 'center' }); return; }
  toast('تم حفظ الإعدادات');
  renderSettings();
}

/* ---------- المستخدمون (مدير) ---------- */
async function renderUsers(editing) {
  if (!portal.users || !editing) {
    $('#tabBody').innerHTML = '<div class="empty">جاري التحميل...</div>';
    const j = await api('listUsers');
    if (!j.ok) { $('#tabBody').innerHTML = '<div class="empty">' + esc(errMsg(j)) + '</div>'; return; }
    portal.users = j.users; portal.usersDepts = j.depts;
  }
  const u = editing && editing !== 'new' ? portal.users.find(x => x.username === editing) : null;
  const isNew = editing === 'new';
  $('#tabBody').innerHTML =
    '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h3>المستخدمون</h3><p class="hint" style="margin:0">مسؤول القسم يرى بلاغات قسمه فقط. المدير يرى كل شيء.</p></div><button type="button" class="btn small" data-user-new>+ مستخدم جديد</button></div>' +
    '<div class="tbl-wrap" style="margin-top:14px"><table class="tbl"><thead><tr><th>المستخدم</th><th>الاسم</th><th>الدور</th><th>الحالة</th><th>آخر دخول</th><th></th></tr></thead><tbody>' +
    portal.users.map(x => '<tr><td style="direction:ltr;text-align:start">' + esc(x.username) + '</td><td>' + esc(x.name) + '</td><td>' + (x.role === 'admin' ? 'مدير' : esc(x.deptName)) + '</td><td>' + (x.active ? '<span class="pill st-done">فعّال</span>' : '<span class="pill late-tag">موقوف</span>') + (x.mustChange ? ' <span class="pill st-new">كلمة مؤقتة</span>' : '') + '</td><td>' + esc(fmt(x.lastLogin) || '—') + '</td><td><button type="button" class="secondary small" data-user-edit="' + esc(x.username) + '">تعديل</button></td></tr>').join('') + '</tbody></table></div></div>' +
    (editing ? userFormHtml(u, isNew) : '');
  if (editing) $('#uName').focus();
}

function userFormHtml(u, isNew) {
  const role = u ? u.role : 'dept';
  return '<div class="card"><h3>' + (isNew ? 'مستخدم جديد' : 'تعديل: ' + esc(u.username)) + '</h3><div class="row">' +
    '<div class="field"><label class="q">اسم المستخدم</label><input type="text" id="uUser" value="' + esc(u ? u.username : '') + '"' + (isNew ? '' : ' disabled') + ' style="direction:ltr;text-align:start" autocapitalize="off"></div>' +
    '<div class="field"><label class="q">الاسم</label><input type="text" id="uName" value="' + esc(u ? u.name : '') + '"></div></div><div class="row">' +
    '<div class="field"><label class="q">الدور</label><select id="uRole"><option value="dept"' + (role === 'dept' ? ' selected' : '') + '>مسؤول قسم</option><option value="admin"' + (role === 'admin' ? ' selected' : '') + '>مدير (كل الأقسام)</option></select></div>' +
    '<div class="field" id="uDeptWrap"><label class="q">القسم</label><select id="uDept">' + portal.usersDepts.map(d => '<option value="' + d.id + '"' + (u && u.dept === d.id ? ' selected' : '') + '>' + esc(d.name) + '</option>').join('') + '</select></div></div>' +
    '<div class="field"><label class="q">' + (isNew ? 'كلمة مرور مؤقتة' : 'إعادة تعيين كلمة المرور <span class="opt">(اتركها فارغة إن لم ترد التغيير)</span>') + '</label><input type="text" id="uPass" autocomplete="off" style="direction:ltr;text-align:start;max-width:320px" placeholder="8 أحرف على الأقل"><p class="hint" style="margin:6px 0 0">سيُطلب من المستخدم تغييرها عند أول دخول. أبلغه بها بنفسك.</p></div>' +
    (isNew ? '' : '<div class="switch-row"><label class="choice"><input type="checkbox" id="uActive"' + (u.active ? ' checked' : '') + ' style="position:absolute;opacity:0"><span>الحساب فعّال</span></label></div>') +
    '<div id="uErr" class="banner bad" hidden></div><div style="display:flex;gap:10px"><button type="button" class="btn" id="uSave" data-new="' + (isNew ? '1' : '') + '">حفظ</button><button type="button" class="secondary" data-user-cancel>إلغاء</button></div></div>';
}

async function saveUser(isNew) {
  const err = $('#uErr'); err.hidden = true;
  const btn = $('#uSave'); btn.disabled = true;
  const role = $('#uRole').value;
  const j = await api('saveUser', { username: $('#uUser').value, name: $('#uName').value, role: role, dept: role === 'dept' ? $('#uDept').value : '', password: $('#uPass').value, active: isNew ? true : $('#uActive').checked });
  btn.disabled = false;
  if (!j.ok) { err.textContent = errMsg(j); err.hidden = false; return; }
  portal.users = j.users; portal.usersDepts = j.depts;
  toast('تم حفظ المستخدم');
  renderUsers();
}

/* ---------- تغيير كلمة المرور ---------- */
function openPasswordModal(forced) {
  $('#modalHost').innerHTML = '<div class="modal-back"><div class="modal narrow">' + (forced ? '' : '<button type="button" class="modal-x" data-close aria-label="إغلاق">×</button>') +
    '<h2>' + (forced ? 'عيّن كلمة مرور جديدة' : 'تغيير كلمة المرور') + '</h2><p class="hint" style="margin-top:6px">' + (forced ? 'كلمتك الحالية مؤقتة. اختر كلمة مرور خاصة بك للمتابعة.' : '') + '</p>' +
    '<div class="field"><label class="q">كلمة المرور الحالية</label><input type="password" id="pwOld" autocomplete="current-password" style="direction:ltr;text-align:start"></div>' +
    '<div class="field"><label class="q">كلمة المرور الجديدة <span class="opt">(8 أحرف على الأقل)</span></label><input type="password" id="pwNew" autocomplete="new-password" style="direction:ltr;text-align:start"></div>' +
    '<div class="field"><label class="q">تأكيد كلمة المرور الجديدة</label><input type="password" id="pwNew2" autocomplete="new-password" style="direction:ltr;text-align:start"></div>' +
    '<div id="pwErr" class="banner bad" hidden></div><button type="button" class="btn" id="pwSave" data-forced="' + (forced ? '1' : '') + '">حفظ</button></div></div>';
  setTimeout(() => $('#pwOld').focus(), 50);
}

async function savePassword(forced) {
  const err = $('#pwErr'); err.hidden = true;
  const o = $('#pwOld').value, n = $('#pwNew').value, n2 = $('#pwNew2').value;
  if (n !== n2) { err.textContent = 'تأكيد كلمة المرور غير مطابق.'; err.hidden = false; return; }
  const btn = $('#pwSave'); btn.disabled = true;
  const j = await api('changePassword', { oldPassword: o, newPassword: n });
  btn.disabled = false;
  if (!j.ok) { err.textContent = errMsg(j); err.hidden = false; return; }
  closeModal();
  toast('تم تغيير كلمة المرور');
  if (forced) enterPortal();
}

/* ---------- تسجيل الدخول والخروج ---------- */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('#loginErr'); err.hidden = true;
  if (isPlaceholder()) { err.textContent = I18N.ar.notConnected; err.hidden = false; return; }
  const u = $('#lUser').value.trim(), p = $('#lPass').value;
  if (!u || !p) { err.textContent = 'أدخل اسم المستخدم وكلمة المرور.'; err.hidden = false; return; }
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'جاري الدخول...';
  const j = await api('login', { username: u, password: p, token: null });
  btn.disabled = false; btn.textContent = 'دخول';
  if (!j.ok) { err.textContent = errMsg(j); err.hidden = false; return; }
  portal.token = j.token; portal.user = j.user; saveSession();
  $('#lPass').value = '';
  if (j.mustChange) { setLang('ar'); show('viewPortal'); $('#pUserName').textContent = j.user.name; $('#pRole').textContent = j.user.role === 'admin' ? 'مدير الجودة' : 'مسؤول ' + (j.user.deptName || ''); $('#tabs').innerHTML = ''; $('#tabBody').innerHTML = ''; openPasswordModal(true); }
  else enterPortal();
});

async function logout() {
  if (portal.token) api('logout');
  clearSession();
  portal.cases = []; portal.users = null; portal.settings = null;
  closeModal();
  history.replaceState(null, '', location.pathname + location.search);
  show('viewHome');
}

/* ===================== التوجيه والأحداث ===================== */
async function route() {
  if (location.hash === '#portal') {
    if (loadSession()) { enterPortal(); } else showLogin();
  } else {
    if (state.view === 'viewPortal' || state.view === 'viewLogin') show('viewHome');
  }
}
window.addEventListener('hashchange', route);

document.addEventListener('click', e => {
  const el = e.target.closest('[data-dept],[data-tab],[data-status],[data-case],[data-close],[data-user-new],[data-user-edit],[data-user-cancel]');
  const id = e.target.id;
  if (e.target.matches('.modal-back[data-close-bg]') && !e.target.closest('.modal')) { closeModal(); return; }
  if (id === 'fullCard' || e.target.closest('#fullCard')) { if (!$('#fullCard').disabled) openForm('full'); return; }
  if (!el) return;
  if (el.hasAttribute('data-dept')) openForm('dept', el.getAttribute('data-dept'));
  else if (el.hasAttribute('data-tab')) { portal.tab = el.getAttribute('data-tab'); portal.users = null; renderTab(); }
  else if (el.hasAttribute('data-status')) { portal.filters.status = el.getAttribute('data-status'); renderCases(); }
  else if (el.hasAttribute('data-case')) openCase(el.getAttribute('data-case'));
  else if (el.hasAttribute('data-close')) closeModal();
  else if (el.hasAttribute('data-user-new')) renderUsers('new');
  else if (el.hasAttribute('data-user-edit')) renderUsers(el.getAttribute('data-user-edit'));
  else if (el.hasAttribute('data-user-cancel')) renderUsers();
});

document.addEventListener('click', e => {
  const id = e.target.id;
  if (id === 'cSave') saveCase(e.target.getAttribute('data-case-id'));
  if (id === 'sSave') saveSettings();
  if (id === 'uSave') saveUser(!!e.target.getAttribute('data-new'));
  if (id === 'pwSave') savePassword(!!e.target.getAttribute('data-forced'));
  if (id === 'btnRefresh') refreshCases();
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'fDept') { portal.filters.dept = e.target.value; renderCaseList(); }
  if (id === 'fBranch') { portal.filters.branch = e.target.value; renderCaseList(); }
  if (id === 'sOpen') syncOpenLabel();
  if (id === 'uRole') { $('#uDeptWrap').hidden = e.target.value === 'admin'; }
});
document.addEventListener('input', e => { if (e.target.id === 'fQ') { portal.filters.q = e.target.value; renderCaseList(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modalHost .modal-x')) closeModal(); });

$('#btnAr').addEventListener('click', () => setLang('ar'));
$('#btnEn').addEventListener('click', () => setLang('en'));
$('#btnBack').addEventListener('click', () => show('viewHome'));
$('#btnHome').addEventListener('click', () => show('viewHome'));
$('#portalLink').addEventListener('click', () => { location.hash = '#portal'; });
$('#loginBack').addEventListener('click', () => { history.replaceState(null, '', location.pathname + location.search); show('viewHome'); });
$('#btnLogout').addEventListener('click', logout);
$('#btnChangePw').addEventListener('click', () => openPasswordModal(false));

window.addEventListener('scroll', () => {
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  $('#progressFill').style.width = (max > 0 ? Math.min(100, Math.max(0, h.scrollTop / max * 100)) : 0) + '%';
});

setLang('ar');
loadConfig();
route();
})();
</script>
</body>
</html>
