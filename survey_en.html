<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Quality Survey — Apex Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#0B3843;
    --teal-800:#0F4C5C;
    --teal-700:#166374;
    --sand-500:#D98A47;
    --sand-100:#FBEBDA;
    --bg:#F4F8F7;
    --card:#FFFFFF;
    --ink:#1E2A2E;
    --muted:#64777A;
    --line:#DCE6E5;
    --line-soft:#EAF1F0;
    --ok:#2F8F6B;
    --font-body:'IBM Plex Sans Arabic', 'Tahoma', sans-serif;
    --font-head:'IBM Plex Sans Arabic', 'Tahoma', sans-serif;
  }
  html[lang="en"]{
    --font-body:'IBM Plex Sans', 'Segoe UI', sans-serif;
    --font-head:'Fraunces', serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .bg-texture{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(60rem 40rem at 90% -10%, rgba(15,76,92,0.07), transparent 60%),
      radial-gradient(50rem 35rem at -10% 105%, rgba(217,138,71,0.09), transparent 60%);
  }

  .top-bar{
    position:sticky; top:0; z-index:40;
    background:rgba(244,248,247,0.85);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .top-bar-inner{
    max-width:640px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 20px;
  }
  .top-logo{ height:26px; display:flex; align-items:center; }
  .top-logo img{ height:100%; width:auto; display:block; }

  .lang-switch{
    display:flex; background:#fff; border:1px solid var(--line);
    border-radius:999px; padding:3px; gap:2px;
  }
  .lang-switch button{
    font-family:'IBM Plex Sans', sans-serif;
    border:none; background:transparent; cursor:pointer;
    font-size:12.5px; font-weight:600; color:var(--muted);
    padding:6px 14px; border-radius:999px;
    transition:all .15s ease;
  }
  .lang-switch button.active{ background:var(--teal-800); color:#fff; }

  .progress-rail{ height:4px; background:var(--line-soft); }
  .progress-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--teal-700), var(--sand-500));
    transition:width .15s ease-out;
  }

  header.hero{
    padding:44px 20px 30px;
    text-align:center;
    max-width:640px; margin:0 auto;
  }
  html[lang="en"] header.hero{ text-align:left; }

  .logo-wrap{
    display:flex; justify-content:center; margin-bottom:22px;
  }
  html[lang="en"] .logo-wrap{ justify-content:flex-start; }
  .logo-wrap img{ height:44px; width:auto; }

  .eyebrow{
    font-size:13px; font-weight:600; color:var(--sand-500);
    margin-bottom:12px;
  }
  header.hero h1{
    font-family:var(--font-head);
    font-size:26px; font-weight:600; margin:0 0 12px;
    color:var(--teal-900); letter-spacing:0; line-height:1.25;
  }
  html[lang="en"] header.hero h1{ font-size:32px; letter-spacing:-0.01em; }
  header.hero p{
    font-size:15px; color:var(--muted); margin:0 auto;
    max-width:480px; font-weight:400;
  }
  html[lang="en"] header.hero p{ margin:0; }
  .brand-line{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:13px; color:var(--teal-700); font-weight:600;
    margin-top:18px; padding-top:16px;
    border-top:1px solid var(--line);
  }
  html[lang="en"] .brand-line{ justify-content:flex-start; }
  .brand-line svg{ width:16px; height:16px; flex:none; }

  form{ max-width:640px; margin:0 auto; padding:6px 20px 80px; }

  .section{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 22px;
    margin-bottom:20px;
    scroll-margin-top:26px;
  }
  .section-head{ display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .section-head .num{
    width:30px; height:30px; border-radius:9px;
    background:var(--sand-100); color:var(--sand-500);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; flex:none;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .section-head h2{
    font-family:var(--font-head);
    font-size:17px; font-weight:600; margin:0; color:var(--teal-900);
  }
  html[lang="en"] .section-head h2{ font-size:19px; }

  .field{ margin-bottom:18px; }
  .field:last-child{ margin-bottom:0; }
  label.q{ display:block; font-size:14.5px; font-weight:600; color:var(--ink); margin-bottom:9px; }
  label.q .opt{ font-weight:400; color:var(--muted); font-size:13px; }

  input[type=text], textarea{
    width:100%;
    font-family:inherit; font-size:14.5px; color:var(--ink);
    background:#FBFDFD;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:11px 13px;
    resize:vertical;
    transition:border-color .15s ease, background .15s ease;
  }
  textarea{ min-height:80px; }
  input[type=text]:focus, textarea:focus{ outline:none; border-color:var(--teal-700); background:#fff; }

  .choice-group{ display:flex; gap:10px; flex-wrap:wrap; }
  .choice{ position:relative; }
  .choice input{ position:absolute; opacity:0; inset:0; cursor:pointer; margin:0; }
  .choice span{
    display:inline-flex; align-items:center; gap:8px;
    padding:9px 18px;
    border:1.5px solid var(--line);
    border-radius:999px;
    font-size:14px; font-weight:500; color:var(--ink);
    background:#FBFDFD;
    transition:all .15s ease;
  }
  .choice input:checked + span{ border-color:var(--teal-700); background:var(--teal-800); color:#fff; }
  .choice input:focus-visible + span{ outline:2px solid var(--sand-500); outline-offset:2px; }

  .conditional{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); display:none; }
  .conditional.show{ display:block; }

  .submit-bar{ max-width:640px; margin:8px auto 0; padding:0 20px; }
  button.submit{
    width:100%;
    background:var(--teal-800); color:#fff;
    border:none; border-radius:14px;
    padding:16px; font-size:16px; font-weight:600;
    font-family:inherit; cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  button.submit:hover{ background:var(--teal-700); }
  button.submit:active{ transform:scale(.99); }
  button.submit:disabled{ background:#A9BCBE; cursor:not-allowed; }

  .note{ text-align:center; font-size:12.5px; color:var(--muted); margin-top:12px; }

  .state-screen{ max-width:520px; margin:100px auto; padding:0 24px; text-align:center; display:none; }
  .state-screen.show{ display:block; }
  .state-screen .icon{
    width:64px; height:64px; border-radius:50%;
    background:var(--sand-100); color:var(--ok);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 20px;
  }
  .state-screen h2{ font-family:var(--font-head); color:var(--teal-900); font-size:21px; margin:0 0 10px; }
  .state-screen p{ color:var(--muted); font-size:14.5px; }

  #error-banner{
    display:none;
    max-width:640px; margin:0 auto 16px; padding:12px 16px;
    background:#FDEDED; border:1px solid #F3C6C6; color:#9B2C2C;
    border-radius:10px; font-size:13.5px; text-align:center;
  }
  #error-banner.show{ display:block; }
</style>
</head>

  <div class="eyebrow" data-i18n="eyebrow">Apex Care Clinics — بريدة وعنيزة</div>
  <h1 data-i18n="title">استبيان الجودة</h1>
</header>

<div id="error-banner"></div>

<form id="surveyForm">

  <div class="section">
    <div class="field">
      <label class="q" for="fullName" data-i18n="nameLabel">الاسم <span class="opt" data-i18n="optional">(اختياري)</span></label>
      <input type="text" id="fullName" name="fullName" data-i18n-ph="namePh" placeholder="اكتب اسمك إن رغبت">
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="num">1</div>
      <h2 data-i18n="s1">المشاكل العامة في بيئة العمل</h2>
    </div>

    <div class="field">
      <label class="q" for="dailyDifficulties" data-i18n="q1">ما أبرز الصعوبات التي تواجهها في عملك اليومي؟</label>
      <textarea id="dailyDifficulties" name="dailyDifficulties"></textarea>
    </div>

    <div class="field">
      <label class="q" data-i18n="q3">هل تشعر أن التواصل مع الإدارة أو الأقسام الأخرى كافٍ وواضح؟</label>
      <div class="choice-group">
        <label class="choice"><input type="radio" name="communicationClarity" value="yes"><span data-i18n="yes">نعم</span></label>
        <label class="choice"><input type="radio" name="communicationClarity" value="no"><span data-i18n="no">لا</span></label>
      </div>
      <div class="conditional" id="commCond">
        <label class="q" for="communicationDetails"><span data-i18n="describe">وضّح السبب</span> <span class="opt" data-i18n="optional">(اختياري)</span></label>
        <textarea id="communicationDetails" name="communicationDetails"></textarea>
      </div>
    </div>

    <div class="field">
      <label class="q" for="suppliesShortage" data-i18n="q5">هل هناك نقص في أي أدوات أو مستلزمات يؤثر على أدائك؟</label>
      <textarea id="suppliesShortage" name="suppliesShortage"></textarea>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="num">2</div>
      <h2 data-i18n="s2">مشاكل السكن (إن وجد)</h2>
    </div>

    <div class="field">
      <label class="q" data-i18n="q7">ما مدى رضاك عن حالة السكن بشكل عام؟</label>
        <div class="choice-group">
          <label class="choice"><input type="radio" name="housingSatisfaction" value="1"><span>1</span></label>
          <label class="choice"><input type="radio" name="housingSatisfaction" value="2"><span>2</span></label>
          <label class="choice"><input type="radio" name="housingSatisfaction" value="3"><span>3</span></label>
          <label class="choice"><input type="radio" name="housingSatisfaction" value="4"><span>4</span></label>
          <label class="choice"><input type="radio" name="housingSatisfaction" value="5"><span>5</span></label>
        </div>
      </div>
      <div class="field">
        <label class="q" for="housingProblems" data-i18n="q8">هل واجهت مشاكل في السكن؟ (صيانة، نظافة، مواصلات، خصوصية، إلخ)</label>
        <textarea id="housingProblems" name="housingProblems"></textarea>
      </div>
      <div class="field">
        <label class="q" for="housingSuggestions" data-i18n="q9">ما التحسينات التي تقترحها لتحسين ظروف السكن؟</label>
        <textarea id="housingSuggestions" name="housingSuggestions"></textarea>
      </div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="num">3</div>
      <h2 data-i18n="s3">التحسينات والاقتراحات</h2>
    </div>

    <div class="field">
      <label class="q" for="trainingNeeded" data-i18n="q12">هل هناك تدريب أو دعم إضافي ترى أنك بحاجة له؟</label>
      <textarea id="trainingNeeded" name="trainingNeeded"></textarea>
    </div>
    <div class="field">
      <label class="q" for="otherNotes"><span data-i18n="q13">أي ملاحظات أو اقتراحات أخرى تود مشاركتها؟</span> <span class="opt" data-i18n="optional">(اختياري)</span></label>
      <textarea id="otherNotes" name="otherNotes"></textarea>
    </div>
  </div>

  <div class="submit-bar">
    <button type="submit" class="submit" id="submitBtn" data-i18n="submit">إرسال الاستبيان</button>
    <p class="note" data-i18n="note">إجاباتك سرية ولن تُستخدم إلا لأغراض تحسين بيئة العمل.</p>
  </div>
</form>

<div class="state-screen" id="successScreen">
  <div class="icon">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#2F8F6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h2 data-i18n="thanksTitle">شكراً لك</h2>
  <p data-i18n="thanksBody">تم استلام إجاباتك بنجاح. رأيك يساهم مباشرة في تحسين بيئة العمل والسكن لطاقم التمريض.</p>
</div>

      thanksBody: 'Your answers were received successfully. Your feedback directly helps improve the work and housing environment for nursing staff.',
      notConnected: 'The survey is not connected to the server yet. Please add the Apps Script URL in the code.',
      submitError: 'Something went wrong while submitting. Please try again.',
      submitting: 'Submitting...'
    }
  };

  let currentLang = 'ar';

  function setLang(lang) {
    currentLang = lang;
    const html = document.getElementById('htmlRoot');
    html.setAttribute('lang', lang);
    html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    document.getElementById('pageTitle').textContent = I18N[lang].pageTitle;

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (I18N[lang][key] !== undefined) el.textContent = I18N[lang][key];
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const key = el.getAttribute('data-i18n-ph');
      if (I18N[lang][key] !== undefined) el.placeholder = I18N[lang][key];
    });

    document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
    document.getElementById('btnEn').classList.toggle('active', lang === 'en');
  }

  const form = document.getElementById('surveyForm');
  const submitBtn = document.getElementById('submitBtn');
  const errorBanner = document.getElementById('error-banner');
  const progressFill = document.getElementById('progressFill');

  window.addEventListener('scroll', () => {
    const h = document.documentElement;
    const scrolled = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
    progressFill.style.width = Math.min(100, Math.max(0, scrolled)) + '%';
  });

  document.querySelectorAll('input[name="communicationClarity"]').forEach(r => {
    r.addEventListener('change', () => {
      document.getElementById('commCond').classList.toggle('show', r.value === 'no' && r.checked);
    });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorBanner.classList.remove('show');

    if (!SCRIPT_URL || SCRIPT_URL.indexOf('PASTE_YOUR') === 0) {
      errorBanner.textContent = I18N[currentLang].notConnected;
      errorBanner.classList.add('show');
      return;
    }

    const fd = new FormData(form);
    const payload = {};
    fd.forEach((value, key) => { payload[key] = value; });
    payload.formLang = currentLang;

    submitBtn.disabled = true;
    submitBtn.textContent = I18N[currentLang].submitting;

    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(() => {
        form.style.display = 'none';
        errorBanner.style.display = 'none';
        document.getElementById('successScreen').classList.add('show');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .catch(() => {
        errorBanner.textContent = I18N[currentLang].submitError;
        errorBanner.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = I18N[currentLang].submit;
      });
  });

  setLang('ar');
</script>
</body>
</html>
